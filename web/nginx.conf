# Serves the built dashboard and forwards /api/ to the lcache-api container, so the browser
# talks to a single origin, as with the Vite proxy in development (decisions D28).
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # Built assets have content hashes in their names, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        # A long simulation (e.g. 'learned' over 10M requests) can take minutes.
        proxy_read_timeout 300s;
        client_max_body_size 64k;
    }
}
